services:
  - type: web
    name: tech-bidders
    runtime: python
    plan: free
    repo: https://github.com/rajjo166/tech_bidders.git
    branch: main
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --bind 0.0.0.0:$PORT app:app
    healthCheckPath: /health
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_EMAIL
        value: admin@example.com
      - key: ADMIN_PASSWORD
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: tech-bidders-db
          property: connectionString

databases:
  - name: tech-bidders-db
    plan: free
