{% extends "base.html" %}
{% block title %}Book {{ resource.name }} | BookSpace{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-8">
        <div class="card shadow-sm p-4">
            <div class="mb-4">
                <span class="badge text-bg-light">{{ resource.resource_type }}</span>
                <h1 class="page-title mt-2">{{ resource.name }}</h1>
                <p class="text-muted mb-1">📍 {{ resource.location }} · Capacity {{ resource.capacity }}</p>
                <p>{{ resource.description }}</p>
            </div>

            <form method="POST">
                <div class="row g-3">
                    <div class="col-md-4">
                        <label class="form-label">Date</label>
                        <input id="booking_date" name="booking_date" type="date" class="form-control" required>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">Start Time</label>
                        <input name="start_time" type="time" class="form-control" required>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">End Time</label>
                        <input name="end_time" type="time" class="form-control" required>
                    </div>
                    <div class="col-12">
                        <label class="form-label">Purpose</label>
                        <textarea name="purpose" class="form-control" rows="3"
                                  placeholder="Example: Project meeting" required></textarea>
                    </div>
                </div>

                <div class="d-flex gap-2 mt-4">
                    <a href="{{ url_for('index') }}" class="btn btn-outline-secondary">Back</a>
                    <button class="btn btn-primary">Submit Booking</button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
