{% extends "base.html" %}
{% block title %}{{ "Edit" if resource else "Add" }} Resource | BookSpace{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-8">
        <div class="card shadow-sm p-4">
            <h1 class="page-title">{{ "Edit" if resource else "Add" }} Resource</h1>
            <form method="POST" class="mt-3">
                <div class="row g-3">
                    <div class="col-md-6">
                        <label class="form-label">Resource Name</label>
                        <input name="name" class="form-control" required
                               value="{{ resource.name if resource else '' }}">
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Type</label>
                        <input name="resource_type" class="form-control" required
                               placeholder="Laboratory / Hall / Room"
                               value="{{ resource.resource_type if resource else '' }}">
                    </div>
                    <div class="col-md-8">
                        <label class="form-label">Location</label>
                        <input name="location" class="form-control" required
                               value="{{ resource.location if resource else '' }}">
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">Capacity</label>
                        <input name="capacity" type="number" min="1" class="form-control" required
                               value="{{ resource.capacity if resource else 1 }}">
                    </div>
                    <div class="col-12">
                        <label class="form-label">Description</label>
                        <textarea name="description" class="form-control" rows="4">{{ resource.description if resource else '' }}</textarea>
                    </div>
                    {% if resource %}
                    <div class="col-12">
                        <div class="form-check">
                            <input name="is_active" type="checkbox" class="form-check-input"
                                   {% if resource.is_active %}checked{% endif %}>
                            <label class="form-check-label">Resource is active</label>
                        </div>
                    </div>
                    {% endif %}
                </div>
                <div class="mt-4 d-flex gap-2">
                    <a href="{{ url_for('admin_dashboard') }}" class="btn btn-outline-secondary">Cancel</a>
                    <button class="btn btn-primary">Save Resource</button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
